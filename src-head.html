<title>Simulateur Solvabilité II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Concept : tableau de bord de salle de marché prudentielle, bandeau de ratio permanent, onglets par bloc du bilan S2. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#13202B; --ink2:#51616F; --line:#D7DEE4; --track:#E4EAEE;
  --accent:#0B6E75; --accent-ink:#FFFFFF;
  --ok:#1C8A57; --warn:#C28A0A; --crit:#BF3B2D;
  --c1:#16355C; --c2:#0B6E75; --c3:#5A86A8; --c4:#8FB3B0; --c5:#B9A56A; --c6:#8A7BA8; --c7:#A9B4BD;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16202A; --ink:#E5ECF1; --ink2:#9AAEBD; --line:#2A3946; --track:#22303B;
  --accent:#4DB4BB; --accent-ink:#06191B; --ok:#3FBF86; --warn:#E0AE3A; --crit:#EA6F60;
  --c1:#6C98D0; --c2:#4DB4BB; --c3:#7FA6C4; --c4:#6FA19E; --c5:#CDB874; --c6:#A898C6; --c7:#7E8E9B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --ink:#E5ECF1; --ink2:#9AAEBD; --line:#2A3946; --track:#22303B;
  --accent:#4DB4BB; --accent-ink:#06191B; --ok:#3FBF86; --warn:#E0AE3A; --crit:#EA6F60;
  --c1:#6C98D0; --c2:#4DB4BB; --c3:#7FA6C4; --c4:#6FA19E; --c5:#CDB874; --c6:#A898C6; --c7:#7E8E9B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0}
h1 small{display:block;font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.live{display:flex;gap:16px;align-items:baseline}
.live .k{font-size:10px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.live .v{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}
.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn)}.pill.crit{background:var(--crit)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--ink2);font:600 13px var(--font);padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{padding-top:20px;display:grid;gap:20px}
.tab{display:grid;gap:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card h2{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px}
.card h3{font-size:13px;font-weight:700;margin:14px 0 6px}
.note{color:var(--ink2);font-size:12px;margin:8px 0 0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kpi .v{font-family:var(--mono);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink2)}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
td.mut{color:var(--ink2)}
.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.f>span:first-child{font-size:13px}
.in{display:flex;align-items:center;gap:6px}
.in em{font-style:normal;font-size:11px;color:var(--ink2);min-width:26px}
input[type=number]{width:84px;font:500 13px var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
select{font:500 13px var(--font);padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
table input[type=number]{width:64px;padding:3px 5px}
.rows{display:grid;gap:7px}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 76px;gap:10px;align-items:center;font-size:13px}
.row .t{height:14px;background:var(--track);border-radius:2px;position:relative;overflow:hidden}
.row .t i{position:absolute;top:0;bottom:0;left:0;border-radius:2px;background:var(--c2)}
.row .t i.neg{background:var(--c5)}
.row .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.gauge{position:relative;height:22px;background:var(--track);border-radius:3px;margin:30px 0 22px}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.gauge b{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.gauge b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:500 10px var(--mono);color:var(--ink2)}
.gauge b em{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font:500 10px var(--mono);font-style:normal;color:var(--ink2)}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;min-height:300px;border-radius:3px;overflow:hidden}
.col>div{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;color:#fff;font-size:11px;font-weight:700;min-height:16px;overflow:hidden}
.col>div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col>div em{font:500 11px var(--mono);font-style:normal}
.lh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.scn{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px 70px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.scn .t{height:12px;background:var(--track);border-radius:2px;position:relative}
.scn .t i{position:absolute;top:0;bottom:0;border-radius:2px}
.scn .t u{position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:var(--ink2)}
svg text{font-family:var(--mono);font-size:10px;fill:var(--ink2)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .ln{fill:none;stroke-width:2}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:13px}
.mx td,.mx th{padding:3px 4px;text-align:center}
.mx input{width:52px;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:600 12px var(--font);padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:var(--bg);font-size:12px;color:var(--ink2)}
@media (max-width:560px){
  .row{grid-template-columns:90px 1fr 64px}
  .scn{grid-template-columns:1fr 62px 62px}.scn .t{grid-column:1/-1;order:5}
  .live .v{font-size:17px}
  .bs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.row .t i,.gauge i{transition:width .25s}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <h1><small>Formule standard simplifiée · M€</small>Simulateur Solvabilité II</h1>
    <div class="live" id="live"></div>
  </div>
  <nav role="tablist" id="nav"></nav>
</header>
<main>
  <section class="tab" id="tab-syn"></section>
  <section class="tab" id="tab-hyp" hidden></section>
  <section class="tab" id="tab-prov" hidden></section>
  <section class="tab" id="tab-scr" hidden></section>
  <section class="tab" id="tab-fp" hidden></section>
  <section class="tab" id="tab-chocs" hidden></section>
  <section class="tab" id="tab-proj" hidden></section>
  <p class="note">Modèle pédagogique. Calibrages indicatifs : pas de look-through, d'ajustement pour volatilité, de risque de change ni de concentration, risque santé exclu. Ne convient pas à un reporting réglementaire.</p>
</main>
</div>
